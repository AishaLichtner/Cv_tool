<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cvtool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --bg: #eef2f5; --surface: #ffffff; --sunk: #e3e9ee; --ink: #1b2836; --muted: #5a6877;
  --line: #cfd8e0; --accent: #155e75; --accent-ink: #ffffff;
  --ok: #2c6e49; --ok-bg: #e2f0e7; --warn: #8a5a00; --warn-bg: #f6ecd4;
  --gap: #a3352a; --gap-bg: #f6e1de; --ins: #d4ecdc; --del: #f3d6d2;
  --serif: "Literata", Georgia, "Times New Roman", serif;
  --sans: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #121a22; --surface: #1a2530; --sunk: #233140; --ink: #e4ebf1; --muted: #9aa9b7;
    --line: #2f3f4f; --accent: #5fb4cc; --accent-ink: #0d1820;
    --ok: #7fc79c; --ok-bg: #1d3528; --warn: #e0b55a; --warn-bg: #3a2e14;
    --gap: #ee8a7e; --gap-bg: #3e211d; --ins: #1f4030; --del: #4a2520;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 16px/1.55 var(--sans); }
h1, h2, h3 { font-family: var(--serif); font-weight: 600; line-height: 1.25; margin: 0; }
h1 { font-size: 1.6rem; }
h2 { font-size: 1.25rem; margin-bottom: .6rem; }
h3 { font-size: 1.02rem; margin: 1.4rem 0 .5rem; }
p { margin: 0 0 .8rem; }
a { color: var(--accent); }
code { font-size: .9em; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

header { display: flex; align-items: baseline; gap: 1.5rem; flex-wrap: wrap; padding: 1.2rem clamp(1rem, 4vw, 2.5rem) 0; }
header .brand { display: flex; align-items: baseline; gap: .6rem; }
nav { display: flex; gap: .25rem; flex-wrap: wrap; flex: 1; }
nav button { background: none; border: 0; border-bottom: 3px solid transparent; color: var(--muted); font: inherit; padding: .5rem .8rem; cursor: pointer; }
nav button[aria-selected="true"] { color: var(--ink); border-color: var(--accent); font-weight: 700; }
.langswitch { display: flex; gap: .2rem; }
.langswitch button { background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 5px; font: inherit; font-size: .85rem; padding: .15rem .5rem; cursor: pointer; }
.langswitch button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
main { padding: 1.5rem clamp(1rem, 4vw, 2.5rem) 3rem; }
section[hidden], .newcont[hidden], [hidden] { display: none !important; }

.split { display: grid; grid-template-columns: minmax(300px, 5fr) 7fr; gap: 2rem; align-items: start; }
@media (max-width: 900px) { .split { grid-template-columns: 1fr; } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 1.3rem; }
.panel + .panel { margin-top: 1.2rem; }
.sticky { position: sticky; top: 1rem; }
@media (max-width: 900px) { .sticky { position: static; } }

label { display: block; font-weight: 700; margin: .9rem 0 .3rem; }
label.inline { display: flex; align-items: center; gap: .5rem; font-weight: 400; }
textarea, input[type=text], input[type=password], select {
  width: 100%; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: .55rem .7rem; }
textarea { resize: vertical; min-height: 9rem; }
textarea.short { min-height: 0; }
#jd { min-height: 22rem; }
#factsEditor { min-height: 60vh; font: 13px/1.5 ui-monospace, "Cascadia Code", Consolas, monospace; }
select.auto { width: auto; }
.hint { color: var(--muted); font-size: .9rem; }
.actions { display: flex; gap: .6rem; flex-wrap: wrap; margin-top: 1rem; align-items: center; }
button.primary, button.secondary { font: inherit; font-weight: 700; border-radius: 6px; padding: .55rem 1.05rem; cursor: pointer; border: 1px solid var(--accent); }
button.primary { background: var(--accent); color: var(--accent-ink); }
button.secondary { background: transparent; color: var(--accent); }
button:disabled { opacity: .55; cursor: progress; }
.linkbtn { background: none; border: 0; color: var(--gap); font: inherit; cursor: pointer; padding: 0; text-decoration: underline; }
.iconbtn { background: none; border: 1px solid var(--line); color: var(--ink); border-radius: 4px; cursor: pointer; padding: 0 .45rem; font: inherit; line-height: 1.6; }

.status { padding: .8rem 1rem; border-radius: 8px; background: var(--sunk); margin-bottom: 1rem; }
.status.error { background: var(--gap-bg); color: var(--gap); }
.status.warn { background: var(--warn-bg); color: var(--ink); }
.empty { color: var(--muted); padding: 3rem 1rem; text-align: center; }
.banner { margin: 0 clamp(1rem, 4vw, 2.5rem); }

.cov { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
@media (max-width: 640px) { .cov { grid-template-columns: 1fr; } }
.cov h3 { margin-top: 0; font-size: .95rem; }
.cov .ok h3 { color: var(--ok); } .cov .warn h3 { color: var(--warn); } .cov .gap h3 { color: var(--gap); }
.chips { display: flex; flex-wrap: wrap; gap: .35rem; }
.chip { font-size: .88rem; padding: .15rem .55rem; border-radius: 999px; background: var(--sunk); }
.ok .chip { background: var(--ok-bg); color: var(--ok); }
.warn .chip { background: var(--warn-bg); color: var(--warn); }
.gap .chip { background: var(--gap-bg); color: var(--gap); }
.chip.must { font-weight: 700; }

.proof { border-left: 3px solid var(--ok); padding: .4rem 0 .4rem 1rem; margin: 0 0 1rem; }
.proof.sug { border-color: var(--warn); }
.proof .id { font-size: .8rem; color: var(--muted); }
.proof .before { color: var(--muted); }
.proof ins { background: var(--ins); text-decoration: none; border-radius: 3px; padding: 0 2px; }
.proof del { background: var(--del); border-radius: 3px; padding: 0 2px; }
.proof .basis { font-size: .85rem; color: var(--muted); margin-top: .3rem; }
.proof .basis b { color: var(--ok); font-weight: 400; }
.qed { color: var(--ok); margin-left: .3rem; }
ul.log { padding-left: 1.2rem; margin: 0; } ul.log li { margin-bottom: .3rem; }
iframe.pdf { width: 100%; height: 80vh; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
pre.err { white-space: pre-wrap; background: var(--gap-bg); color: var(--ink); padding: .8rem 1rem; border-radius: 8px; font: 13px/1.5 ui-monospace, Consolas, monospace; overflow-x: auto; margin: .6rem 0 0; }

.modes { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-bottom: 1rem; }
.modes button { background: var(--surface); border: 0; padding: .5rem 1rem; font: inherit; color: var(--muted); cursor: pointer; }
.modes button.on { background: var(--accent); color: var(--accent-ink); font-weight: 700; }

.card { border: 1px solid var(--line); border-radius: 8px; padding: 1rem; margin-bottom: 1rem; background: var(--bg); }
.card .head { display: grid; grid-template-columns: repeat(4, 1fr) auto; gap: .5rem; align-items: end; }
.card .head.proj { grid-template-columns: 2fr 1fr auto; }
@media (max-width: 760px) { .card .head, .card .head.proj { grid-template-columns: 1fr 1fr; } }
.card .head label { margin-top: 0; font-size: .85rem; }
.card .tools { display: flex; gap: .3rem; justify-content: flex-end; }
.bul { border-top: 1px dashed var(--line); padding: .7rem 0; display: grid; grid-template-columns: 1fr auto; gap: .6rem; }
.bul .meta { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: .5rem; margin-top: .4rem; }
@media (max-width: 760px) { .bul .meta { grid-template-columns: 1fr; } }
.bul .meta input, .bul .meta select { font-size: .9rem; padding: .35rem .5rem; }
.bul .side { display: flex; flex-direction: column; gap: .3rem; }
label.mini { margin: 0; font-weight: 400; } label.mini span { display: block; font-size: .78rem; color: var(--muted); margin-bottom: .1rem; }
.kind { font-size: .8rem; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.subtabs { display: flex; gap: .4rem; flex-wrap: wrap; margin-bottom: 1rem; }
.subtabs button { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: .35rem .9rem; font: inherit; cursor: pointer; color: var(--muted); }
.subtabs button.on { border-color: var(--accent); color: var(--ink); font-weight: 700; }

.rows .row { display: grid; gap: .5rem; margin-bottom: .5rem; align-items: center; }
.rows .row.multi { border: 1px solid var(--line); border-radius: 8px; padding: .6rem; }
.rows .row.multi .iconbtn { justify-self: start; }
.rows .row input { font-size: .92rem; padding: .4rem .55rem; }

table.skills { border-collapse: collapse; width: 100%; min-width: 640px; }
table.skills th { text-align: left; font-size: .85rem; color: var(--muted); font-weight: 700; padding: .3rem .5rem; }
table.skills td { padding: .3rem .5rem; border-top: 1px solid var(--line); vertical-align: middle; }
table.skills tr.grouphead td { border-top: 2px solid var(--line); padding-top: 1rem; font-family: var(--serif); font-weight: 600; }
table.skills select { width: auto; padding: .3rem .4rem; }
table.skills td.c { text-align: center; }
table.skills tr.pin td:first-child { font-weight: 700; }

.checks { list-style: none; padding: 0; margin: 0; }
.checks li { padding: .6rem 0; border-bottom: 1px solid var(--line); }
.checks .mark { display: inline-block; width: 1.4rem; font-weight: 700; }
.checks .yes { color: var(--ok); } .checks .no { color: var(--gap); }
.history ul { padding: 0; } .history li { margin-bottom: 1rem; list-style: none; }
.history .jd { color: var(--muted); font-size: .9rem; }
details summary { cursor: pointer; font-weight: 700; }
@media (prefers-reduced-motion: no-preference) {
  .reveal { animation: reveal .35s ease-out; }
  @keyframes reveal { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
}
</style>
</head>
<body>
<header>
  <div class="brand"><h1>cvtool</h1><span class="hint" id="ver"></span></div>
  <nav role="tablist">
    <button role="tab" aria-selected="true" data-tab="tailor" data-i18n="tab_tailor"></button>
    <button role="tab" aria-selected="false" data-tab="add" data-i18n="tab_add"></button>
    <button role="tab" aria-selected="false" data-tab="edit" data-i18n="tab_edit"></button>
    <button role="tab" aria-selected="false" data-tab="history" data-i18n="tab_history"></button>
    <button role="tab" aria-selected="false" data-tab="settings" data-i18n="tab_settings"></button>
  </nav>
  <div class="langswitch" aria-label="Language"><button data-lang="de">DE</button><button data-lang="en">EN</button></div>
</header>
<div id="banners" class="banner" style="margin-top:1rem"></div>

<main>
<!-- ================= TAILOR ================= -->
<section id="tab-tailor">
  <div class="split">
    <div class="panel sticky">
      <label for="jd" data-i18n="jd_label"></label>
      <textarea id="jd" data-i18n-ph="jd_ph"></textarea>
      <label for="jobname"><span data-i18n="jobname"></span> <span class="hint" data-i18n="optional"></span></label>
      <input type="text" id="jobname" data-i18n-ph="jobname_ph">
      <label for="maxpages" data-i18n="maxpages"></label>
      <select id="maxpages" class="auto"><option value="1" data-i18n="page1"></option><option value="2" data-i18n="page2"></option></select>
      <label class="inline"><input type="checkbox" id="llmcheck"> <span data-i18n="llmcheck"></span></label>
      <div class="actions"><button class="primary" id="runTailor" data-i18n="run_tailor"></button><span class="hint" id="tailorHint"></span></div>
    </div>
    <div id="tailorOut"><div class="empty" data-i18n="tailor_empty"></div></div>
  </div>
</section>

<!-- ================= ADD / IMPORT ================= -->
<section id="tab-add" hidden>
  <div class="modes"><button data-mode="single" class="on" data-i18n="mode_single"></button><button data-mode="import" data-i18n="mode_import"></button></div>
  <div class="split" id="addSingle">
    <div class="panel">
      <label for="addText" data-i18n="add_label"></label>
      <textarea id="addText" data-i18n-ph="add_ph"></textarea>
      <p class="hint" data-i18n="add_hint"></p>
      <div class="actions"><button class="primary" id="runPropose" data-i18n="run_propose"></button></div>
    </div>
    <div id="addOut"><div class="empty" data-i18n="add_empty"></div></div>
  </div>
  <div class="split" id="addImport" hidden>
    <div class="panel">
      <h2 data-i18n="imp_title"></h2>
      <p class="hint" data-i18n="imp_hint"></p>
      <label for="impFile" data-i18n="imp_file"></label>
      <input type="file" id="impFile" accept=".pdf,.tex,.txt,.md">
      <label for="impText" data-i18n="imp_text"></label>
      <textarea id="impText" data-i18n-ph="imp_ph"></textarea>
      <div class="actions"><button class="primary" id="runImport" data-i18n="run_import"></button></div>
    </div>
    <div id="impOut"><div class="empty" data-i18n="imp_empty"></div></div>
  </div>
</section>

<!-- ================= EDIT ================= -->
<section id="tab-edit" hidden>
  <div class="subtabs">
    <button data-sub="entries" class="on" data-i18n="sub_entries"></button>
    <button data-sub="profile" data-i18n="sub_profile"></button>
    <button data-sub="skills" data-i18n="sub_skills"></button>
    <button data-sub="json" data-i18n="sub_json"></button>
  </div>

  <div id="sub-entries" class="panel">
    <h2 data-i18n="ent_title"></h2>
    <p class="hint" data-i18n="ent_hint"></p>
    <div id="dupBanner"></div>
    <div id="entriesList"></div>
    <div class="actions">
      <button class="secondary" id="addExp" data-i18n="add_exp"></button>
      <button class="secondary" id="addProj" data-i18n="add_proj"></button>
    </div>
    <div class="actions"><button class="primary" id="saveEntries" data-i18n="save"></button><span class="hint" id="entriesHint"></span></div>
  </div>

  <div id="sub-profile" class="panel" hidden>
    <h2 data-i18n="prof_title"></h2>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:.8rem">
      <div><label for="pFirst" data-i18n="first_name"></label><input type="text" id="pFirst"></div>
      <div><label for="pLast" data-i18n="last_name"></label><input type="text" id="pLast"></div>
    </div>
    <h3 data-i18n="contacts"></h3><p class="hint" data-i18n="contacts_hint"></p><div class="rows" id="pContacts"></div>
    <h3 data-i18n="education"></h3><div class="rows" id="pEdu"></div>
    <h3 data-i18n="certs"></h3><div class="rows" id="pCerts"></div>
    <h3 data-i18n="langs"></h3><div class="rows" id="pLangs"></div>
    <div class="actions"><button class="primary" id="saveProfile" data-i18n="save"></button><span class="hint" id="profileHint"></span></div>
  </div>

  <div id="sub-skills" class="panel" hidden>
    <h2 data-i18n="sk_title"></h2>
    <p class="hint" data-i18n-html="sk_hint"></p>
    <div style="overflow-x:auto"><table class="skills" id="skillTable"></table></div>
    <div class="actions"><button class="primary" id="saveSkills" data-i18n="save"></button><span class="hint" id="skillsHint"></span></div>
  </div>

  <div id="sub-json" class="panel" hidden>
    <h2>facts.json</h2>
    <p class="hint" data-i18n="json_hint"></p>
    <textarea id="factsEditor" spellcheck="false"></textarea>
    <div class="actions"><button class="primary" id="saveFacts" data-i18n="save"></button><button class="secondary" id="reloadFacts" data-i18n="reload"></button><span class="hint" id="factsHint"></span></div>
  </div>
</section>

<!-- ================= HISTORY ================= -->
<section id="tab-history" hidden>
  <div class="panel history"><h2 data-i18n="tab_history"></h2><div id="historyOut"></div></div>
</section>

<!-- ================= SETTINGS ================= -->
<section id="tab-settings" hidden>
  <div class="split">
    <div>
      <div class="panel">
        <h2 data-i18n="set_title"></h2>
        <label for="sKey" data-i18n="set_key"></label>
        <input type="password" id="sKey" autocomplete="off">
        <p class="hint" data-i18n-html="set_key_hint"></p>
        <label for="sModel" data-i18n="set_model"></label>
        <input type="text" id="sModel">
        <label for="sPages" data-i18n="set_pages"></label>
        <select id="sPages" class="auto"><option value="1" data-i18n="page1"></option><option value="2" data-i18n="page2"></option></select>
        <div class="actions"><button class="primary" id="saveSettings" data-i18n="save"></button><span class="hint" id="settingsHint"></span></div>
      </div>
      <div class="panel">
        <h2 data-i18n="share_title"></h2>
        <p class="hint" data-i18n="share_hint"></p>
        <div class="actions"><a class="primary" href="/api/export" style="text-decoration:none;font-weight:700;border-radius:6px;padding:.55rem 1.05rem;background:var(--accent);color:var(--accent-ink)" data-i18n="share_btn"></a></div>
        <p class="hint" style="margin-top:1rem" id="dataDir"></p>
      </div>
    </div>
    <div class="panel">
      <h2 data-i18n="diag_title"></h2>
      <p class="hint" data-i18n="diag_hint"></p>
      <div class="actions">
        <button class="primary" id="runDiagnose" data-i18n="diag_run"></button>
        <button class="secondary" id="getTectonic" data-i18n="tectonic_btn"></button>
      </div>
      <p class="hint" data-i18n="tectonic_hint"></p>
      <div id="setupOut" style="margin-top:1rem"></div>
    </div>
  </div>
</section>
</main>

<script>
/* ================= i18n ================= */
const I18N = {

let LANG = "de";
const t = (k, v = {}) => (I18N[LANG][k] ?? I18N.de[k] ?? k).replace(/\{(\w+)\}/g, (_, x) => v[x] ?? "");
function applyI18n() {

  document.querySelectorAll("[data-i18n-html]").forEach(el => el.innerHTML = t(el.dataset.i18nHtml));
  document.querySelectorAll("[data-i18n-ph]").forEach(el => el.placeholder = t(el.dataset.i18nPh));
  document.querySelectorAll(".langswitch button").forEach(b => b.classList.toggle("on", b.dataset.lang === LANG));

/* ================= helpers ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const normName = s => String(s || "").toLowerCase().normalize("NFKD").replace(/[^a-z0-9]+/g, " ").trim();
const splitList = s => String(s || "").split(",").map(x => x.trim()).filter(Boolean);
async function call(method, url, body) {
  const r = await fetch(url, {method, headers: {"Content-Type": "application/json"}, body: body ? JSON.stringify(body) : undefined});
  const data = await r.json().catch(() => ({error: t("server_down", {s: r.status})}));
  if (!r.ok || data.error) throw new Error(data.error || `HTTP ${r.status}`);
  return data;
}
function busy(btn, on, label) {
  btn.disabled = on;
  if (on) { btn.dataset.label = btn.textContent; btn.textContent = label || t("working"); }
  else if (btn.dataset.label) btn.textContent = btn.dataset.label;
}
const errBox = m => `<div class="status error">${esc(m)}</div>`;
function flash(el, msg) { el.textContent = msg; setTimeout(() => { if (el.textContent === msg) el.textContent = ""; }, 4000); }

/* word diff */
function wordDiff(a, b) {
  const A = a.split(/(\s+)/), B = b.split(/(\s+)/), n = A.length, m = B.length;
  const L = Array.from({length: n + 1}, () => new Array(m + 1).fill(0));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) L[i][j] = A[i] === B[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  let i = 0, j = 0, before = "", after = "";
  while (i < n || j < m) {
    if (i < n && j < m && A[i] === B[j]) { before += esc(A[i]); after += esc(B[j]); i++; j++; }
    else if (j < m && (i >= n || L[i][j + 1] >= L[i + 1][j])) { after += /\S/.test(B[j]) ? `<ins>${esc(B[j])}</ins>` : esc(B[j]); j++; }
    else { before += /\S/.test(A[i]) ? `<del>${esc(A[i])}</del>` : esc(A[i]); i++; }
  }
  const merge = (h, tg) => h.replace(new RegExp(`</${tg}>(\\s*)<${tg}>`, "g"), "$1");
  return {before: merge(before, "del"), after: merge(after, "ins")};
}

/* ================= TAILOR ================= */
$("#runTailor").addEventListener("click", async () => {
  const btn = $("#runTailor"), out = $("#tailorOut"), jd = $("#jd").value.trim();
  if (!jd) { out.innerHTML = errBox(t("need_jd")); return; }
  busy(btn, true); $("#tailorHint").textContent = t("tailor_wait");
  out.innerHTML = `<div class="status">${esc(t("tailor_progress"))}</div>`;
  try {
    const r = await call("POST", "/api/tailor", {jd, name: $("#jobname").value, llm_check: $("#llmcheck").checked, max_pages: +$("#maxpages").value});
    out.innerHTML = renderTailor(r); bindEvidence(r.name);
  } catch (e) { out.innerHTML = errBox(e.message); }
  finally { busy(btn, false); $("#tailorHint").textContent = ""; }
});

function renderTailor(r) {
  const groups = {abgedeckt: [], umformulierbar: [], LUECKE: []};
  r.coverage.forEach(k => groups[k.status].push(k));
  const chips = list => list.length ? `<div class="chips">${list.map(k => `<span class="chip ${k.importance === 3 ? "must" : ""}">${esc(k.term)}</span>`).join("")}</div>` : `<p class="hint">${t("none")}</p>`;
  const pg = n => `${n} ${n === 1 ? t("page_s") : t("page_p")}`;
  const pdfBlock = r.pdf
    ? `<p><a href="${r.pdf}" download="CV_${esc(r.name)}.pdf"><b>${t("download_pdf")}</b></a> (${pg(r.pages)}) · <a href="${r.tex}" download>cv.tex</a> · <a href="${r.report}" target="_blank">${t("report")}</a></p>
       <iframe class="pdf" src="${r.pdf}?t=${Date.now()}#view=FitH" title="CV"></iframe>`
    : `<div class="status error">${esc(t("pdf_failed"))} <a href="${r.tex}" download>cv.tex</a></div>${r.latex_error ? `<pre class="err">${esc(r.latex_error)}</pre>` : ""}`;
  const changed = r.changed.length ? r.changed.map(c => {
    const d = wordDiff(c.original, c.new);
    return `<div class="proof"><div class="id">${esc(c.id)}</div><div class="before">${d.before}</div><div>${d.after}<span class="qed">∎</span></div>
      <div class="basis">${t("allowed")} ${c.allowed_terms.map(x => `<b>${esc(x)}</b>`).join(", ") || t("only_orig")}</div></div>`;
  }).join("") : `<p class="hint">${t("no_changes")}</p>`;
  const evidence = r.evidence.length ? `<h3>${t("ev_title")}</h3><p class="hint">${t("ev_hint")}</p>
    <div id="evidenceList">${r.evidence.map(p => `<div class="proof sug"><div><b>${esc(p.keyword)}</b> <span class="hint">– ${esc(p.reason)}</span></div>
      ${p.bullets.map(b => `<label class="inline" style="margin:.4rem 0 0"><input type="checkbox" data-term="${esc(p.keyword)}" data-bullet="${esc(b.id)}"><span>${t("ev_applies")} <span class="hint">${esc(b.text)}</span></span></label>`).join("")}</div>`).join("")}</div>
    <div class="actions"><button class="primary" id="applySyn">${t("ev_apply")}</button></div>` : "";
  return `<div class="reveal">
    <div class="panel"><h2>${t("cov_title")}</h2><p class="hint">${t("cov_hint")}</p>
      <div class="cov"><div class="ok"><h3>${t("cov_ok")}</h3>${chips(groups.abgedeckt)}</div><div class="warn"><h3>${t("cov_warn")}</h3>${chips(groups.umformulierbar)}</div><div class="gap"><h3>${t("cov_gap")}</h3>${chips(groups.LUECKE)}</div></div>${evidence}</div>
    <div class="panel"><h2>${t("changed_title")}</h2>${changed}<h3>${t("log_title")}</h3>${r.log.length ? `<ul class="log">${r.log.map(l => `<li>${esc(l)}</li>`).join("")}</ul>` : `<p class="hint">${t("log_ok")}</p>`}</div>
    <div class="panel"><h2>${t("cv_title")}</h2>${pdfBlock}</div></div>`;
}
function bindEvidence(name) {
  $("#applySyn")?.addEventListener("click", async e => {
    const additions = [...document.querySelectorAll("#evidenceList input:checked")].map(cb => ({term: cb.dataset.term, bullet_id: cb.dataset.bullet}));
    if (!additions.length) { alert(t("ev_none_checked")); return; }
    busy(e.target, true);
    try { await call("POST", "/api/synonyms", {additions}); if (!$("#jobname").value) $("#jobname").value = name; $("#runTailor").click(); }
    catch (err) { busy(e.target, false); alert(err.message); }
  });
}

const cName = (kind, c) => kind === "experience" ? c.company : c.name;
function dupGroups() {
  const out = [];
  for (const kind of ["experience", "projects"]) {
    const seen = {};
    ENT[kind].forEach((c, i) => { const k = normName(cName(kind, c)); if (!k) return; (seen[k] = seen[k] || []).push(i); });
    Object.values(seen).filter(ix => ix.length > 1).forEach(ix => out.push({kind, ix}));
  }
  return out;
}

            <label class="mini"><span>${t("synonyms")}</span><input type="text" data-b="${kind}:${i}:${j}" data-k="synonyms" value="${esc((b.synonyms || []).join(", "))}" placeholder="${t("comma_hint")}"></label>

let skillData = null;
async function loadSkills() { try { skillData = await call("GET", "/api/skills"); drawSkills(); } catch (e) { $("#skillsHint").textContent = e.message; } }
function drawSkills() {
  const {groups, rows} = skillData;
  const special = [["__expertise__", t("to_expertise")], ["__delete__", t("delete")]];
  let html = `<tr><th>${t("sk_skill")}</th><th>${t("sk_group")}</th><th>${t("sk_pin")}</th><th>${t("sk_hide")}</th><th>${t("sk_order")}</th></tr>`;

    html += `<tr class="grouphead"><td colspan="5">${esc(g)}</td></tr>`;
    rows.forEach((r, i) => { if (r.group !== g) return;

      html += `<tr class="${r.pinned ? "pin" : ""}"><td>${esc(r.name)}</td><td><select data-i="${i}" class="s-group">${opts}</select></td>
        <td class="c"><input type="checkbox" class="s-pin" data-i="${i}" ${r.pinned ? "checked" : ""} aria-label="${t("sk_pin")}"></td>
        <td class="c"><input type="checkbox" class="s-hid" data-i="${i}" ${r.hidden ? "checked" : ""} ${r.pinned ? "disabled" : ""} aria-label="${t("sk_hide")}"></td>
        <td><button class="iconbtn mv" data-i="${i}" data-d="-1">↑</button> <button class="iconbtn mv" data-i="${i}" data-d="1">↓</button></td></tr>`; });
  });
  const T = $("#skillTable"); T.innerHTML = html;
  T.querySelectorAll(".s-group").forEach(el => el.addEventListener("change", () => { rows[el.dataset.i].group = el.value; if (el.value.startsWith("__")) el.closest("tr").style.opacity = .45; else drawSkills(); }));
  T.querySelectorAll(".s-pin").forEach(el => el.addEventListener("change", () => { rows[el.dataset.i].pinned = el.checked; if (el.checked) rows[el.dataset.i].hidden = false; drawSkills(); }));
  T.querySelectorAll(".s-hid").forEach(el => el.addEventListener("change", () => { rows[el.dataset.i].hidden = el.checked; }));
  T.querySelectorAll(".mv").forEach(el => el.addEventListener("click", () => { const i = +el.dataset.i, d = +el.dataset.d, g = rows[i].group; let j = i + d;
    while (j >= 0 && j < rows.length && rows[j].group !== g) j += d; if (j < 0 || j >= rows.length) return; [rows[i], rows[j]] = [rows[j], rows[i]]; drawSkills(); }));
}

});
$("#runDiagnose").addEventListener("click", async e => {
  const out = $("#setupOut"); busy(e.target, true); out.innerHTML = "";
  try { const r = await call("POST", "/api/diagnose");
    out.innerHTML = `<ul class="checks">${r.checks.map(c => `<li><span class="mark ${c.ok ? "yes" : "no"}">${c.ok ? "✓" : "✗"}</span><b>${esc(c.name)}</b>${c.ok ? `<div class="hint">${esc(c.detail)}</div>` : `<pre class="err">${esc(c.detail)}</pre>`}</li>`).join("")}</ul>
      ${r.pdf ? `<h3>${t("diag_test")}</h3><iframe class="pdf" src="${r.pdf}?t=${Date.now()}#view=FitH" title="CV"></iframe>` : ""}`;
  } catch (err) { out.innerHTML = errBox(err.message); }
  finally { busy(e.target, false); }
});
$("#getTectonic").addEventListener("click", async e => {
  busy(e.target, true);
  try { const r = await call("POST", "/api/tectonic"); $("#setupOut").innerHTML = `<div class="status">${esc(t("tectonic_ok", {p: r.path}))}</div>`; }
  catch (err) { $("#setupOut").innerHTML = errBox(err.message); }
  finally { busy(e.target, false); }
});

/* start */
applyI18n(); refreshState().then(() => { if (!STATE.has_key) showTab("settings"); else if (!STATE.has_entries) { showTab("add"); setAddMode("import"); } });
</script>
</body>
</html>
